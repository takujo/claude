# ============================================================
#  Discord 適時開示通知システム - 設定ファイル
# ============================================================

discord:
  # Discord Webhook URL（サーバー設定 > 連携サービス > ウェブフック から取得）
  webhook_url: "YOUR_DISCORD_WEBHOOK_URL_HERE"
  # 通知送信者名
  username: "適時開示Bot"

# 巡回間隔（秒）
interval: 300  # 5分

# ------------------------------------------------------------
#  フィルタリング設定
# ------------------------------------------------------------

# キーワードフィルタ（開示タイトルに含まれるキーワード）
# いずれかにマッチすれば通知対象
keywords:
  - 決算短信
  - 業績予想の修正
  - 配当予想の修正
  - 自己株式の取得
  - 自己株式の消却
  - 自己株式立会外買付取引
  - 公開買付け
  - MBO
  - TOB
  - 株式分割
  - 株式併合
  - 新株予約権
  - 代表取締役の異動
  - 特別損失
  - 特別利益
  - 民事再生
  - 上場廃止
  - 合併
  - 株式交換
  - 株式移転
  - 第三者割当

# 監視銘柄コード（空リスト = 全銘柄対象）
# 特定銘柄のみ監視したい場合はコードを追加
watch_codes: []
#  - "7203"  # トヨタ
#  - "6758"  # ソニー
#  - "9984"  # ソフトバンクG

# ------------------------------------------------------------
#  データソース設定
# ------------------------------------------------------------

sources:
  tdnet:
    enabled: true
  edinet:
    enabled: true

# ------------------------------------------------------------
#  Embed カラー設定（Discord通知の色分け）
# ------------------------------------------------------------

category_colors:
  決算短信: 0x2ecc71       # 緑 - 決算関連
  業績予想: 0xe74c3c       # 赤 - 業績修正
  配当: 0x9b59b6           # 紫 - 配当関連
  自己株式: 0x3498db       # 青 - 自社株買い
  MBO: 0xf39c12            # オレンジ - MBO/TOB
  TOB: 0xf39c12            # オレンジ
  公開買付: 0xf39c12       # オレンジ
  上場廃止: 0xe74c3c       # 赤
  民事再生: 0xe74c3c       # 赤
  default: 0x95a5a6        # グレー - その他

# 既知アイテムの保存ファイル
seen_file: "seen_items.json"

# ログレベル（DEBUG / INFO / WARNING / ERROR）
log_level: "INFO"
